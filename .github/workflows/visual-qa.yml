name: Visual QA
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build static game
        run: npm run build
      - name: Install Playwright client
        run: npm install --no-save --ignore-scripts playwright@1.55.0
      - name: Verify runner Chrome
        run: google-chrome --version
      - name: Start local game
        run: |
          python3 -m http.server 4173 >/tmp/atelier-visual-qa.log 2>&1 &
          sleep 1
      - name: Capture deterministic UI states
        env:
          ATELIER_QA_BROWSER: chrome
        run: node scripts/visual-qa.mjs
      - name: Print local server diagnostics on capture failure
        if: failure()
        run: tail -n 60 /tmp/atelier-visual-qa.log || true
      # Temporary branch-scoped inspection of the actual game, separate
      # from the isolated scoreboard renderer. No image logs on normal PRs.
      - name: Inspect actual game screenshots
        if: github.head_ref == 'feat/scoreboard-punch-20261003'
        run: |
          for shot in mobile/goal.png landscape/goal-impact.png desktop/goal-impact.png; do
            test -s "visual-artifacts/$shot"
            echo "ATELIER_LIVE_BEGIN $shot"
            base64 -w 1600 "visual-artifacts/$shot"
            echo
            echo "ATELIER_LIVE_END $shot"
          done
      - name: Run deterministic rival soak
        env:
          ATELIER_QA_BROWSER: chrome
        run: node scripts/rival-soak.mjs
      - name: Upload rival soak report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atelier-rival-soak
          path: rival-artifacts
          if-no-files-found: warn
          retention-days: 14
      - name: Upload visual QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atelier-visual-qa
          path: visual-artifacts
          if-no-files-found: error
          retention-days: 14
