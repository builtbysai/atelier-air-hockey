name: Visual QA
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build static game
        run: npm run build
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save --ignore-scripts playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start local game
        run: |
          python3 -m http.server 4173 >/tmp/atelier-visual-qa.log 2>&1 &
          sleep 1
      - name: Capture deterministic UI states
        run: node scripts/visual-qa.mjs
      - name: Upload visual QA screenshots
        uses: actions/upload-artifact@v4
        with:
          name: atelier-visual-qa
          path: visual-artifacts
          if-no-files-found: error
          retention-days: 14
