name: Stabilize v24
on:
  push:
    branches: [stabilization-v24]
    paths:
      - scripts/post_stabilize_v24.py
      - .github/workflows/stabilize-v24.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stabilization-v24
      - name: Apply final hardening
        run: python3 scripts/post_stabilize_v24.py
      - name: Verify generated sources
        run: npm test
      - name: Commit hardening output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "v24: harden online runtime and finish modular source split"
          git push origin HEAD:stabilization-v24
