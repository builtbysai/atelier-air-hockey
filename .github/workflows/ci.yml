name: CI
on:
  push:
    branches: [main, stabilization-v24]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Focused game-feel regressions
        run: node --test tests/feel-events.test.mjs tests/rally-feedback.test.mjs tests/feel-lab.test.mjs tests/goal-context.test.mjs
      - name: Build and verify
        run: npm test
      - name: Independent build integrity
        if: always()
        run: npm run build && npm run check
