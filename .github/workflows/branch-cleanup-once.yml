name: One-time branch cleanup
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/branch-cleanup-once.yml
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Delete known merged and superseded branches
        shell: bash
        run: |
          set -euo pipefail
          branches=(
          "chore/repo-identity-240924"
          "chore/visual-qa-v33"
          "feat/audio-qr-music-240924"
          "feat/generative-music-240924"
          "feat/neon-audio-fixes-240924"
          "feat/online-netcode-240924"
          "feat/popup-ui-240924"
          "feat/volume-pause-240924"
          "feat/2-5d-views-250925"
          "fix/ai-behavior-music-240924"
          "fix/ai-commitment-240924"
          "fix/bug-trio-240924"
          "fix/corner-stick-and-mallet-improvements"
          "fix/p1-followups-exhibition"
          "fix-rules-close-preference-order"
          "game-flow-hud-replay-pass"
          "gameplay-flow-hud-replay-ux"
          "gameplay-pwa-25d-polish"
          "goal-flow-hud-polish"
          "hud-flow-polish-v29"
          "improve-menu-settings-ia"
          "instant-replay-v1"
          "pwa-icon-hotfix"
          "regression-visual-qa-pass"
          "review/air-hockey-pass-240924"
          "runtime-quality-pwa-haptics"
          "share-highlights-replay-platform"
          "stabilization-v24"
          "victory-celebration-pass"
          "visual-qa-practice-lab"
          "workshop-mastery-progression"
          "workshop-mastery-rivals"
          "chore/branch-cleanup-once"
          )
          for branch in "${branches[@]}"; do
            if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
              echo "Deleting $branch"
              git push origin --delete "$branch"
            else
              echo "Already gone: $branch"
            fi
          done
